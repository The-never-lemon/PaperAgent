defaults:
  llm:
    temperature: null
    max_tokens: null
    reasoning_effort: null
    context_window_tokens: null

# 论文检索数据源的可选密钥；没有密钥时填写 null，系统会继续使用匿名检索。
paper_retrieval:
  openalex_api_key: null
  semantic_scholar_api_key: null

# read 节点的相关系统配置
read:
  agent_name: default_agent
  paper_cache_dir: data/paper_cache
  connect_timeout_seconds: 10
  download_timeout_seconds: 60
  max_file_size_mb: 50
  # PDF 转 Markdown 用哪个解析器：auto（优先 PyMuPDF，装不上就退回 pypdf）/ pymupdf / pypdf
  pdf_parser: auto
