defaults:
  llm:
    temperature: null
    max_tokens: null
    reasoning_effort: null
    # 模型上下文窗口（token 数）。主 Agent 用它给对话历史算预算：
    # 窗口 × 0.8 = 历史可占用上限，超出会自动「归档旧工具结果 → LLM 压缩旧轮次」。
    # 默认 1048576（1M，DeepSeek 长窗口模型的量级）；想快速验证压缩，可临时调小（如 8000）。
    context_window_tokens: null

# 论文检索数据源的可选密钥；没有密钥时填写 null，系统会继续使用匿名检索。
paper_retrieval:
  openalex_api_key: null
  semantic_scholar_api_key: null

# read 节点的相关系统配置
read:
  agent_name: default_agent
  paper_cache_dir: data/paper_cache
  connect_timeout_seconds: 10
  download_timeout_seconds: 60
  max_file_size_mb: 50
  # PDF 转 Markdown 用哪个解析器：auto（优先 PyMuPDF，装不上就退回 pypdf）/ pymupdf / pypdf
  pdf_parser: auto
  # 公式识别：打开后会把论文里的公式截图交给模型转写成 LaTeX 写进 Markdown，
  # 这样精读、问答、写作拿到的才是模型读得懂的公式。会多花一些模型调用（每篇论文
  # 大约几十次，同一页的公式合并成一次请求）。关掉就退回"把公式字形原样写进 $$ 块"。
  formula_ocr: true
